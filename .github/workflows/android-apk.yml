name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Android build compatibility
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("package-lock.json").read_text())
          packages = lock["packages"]
          cli = packages["node_modules/@capacitor/cli"]
          android = packages["node_modules/@capacitor/android"]

          cli_major = int(cli["version"].split(".", 1)[0])
          android_major = int(android["version"].split(".", 1)[0])
          node_requirement = cli["engines"]["node"]
          node_major_match = re.search(r">=\s*(\d+)", node_requirement)
          if not node_major_match:
              raise SystemExit(f"Cannot determine Capacitor CLI Node requirement: {node_requirement}")
          node_major = int(node_major_match.group(1))

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties").read_text()
          gradle_match = re.search(r"gradle-(\d+\.\d+(?:\.\d+)?)-(?:all|bin)\.zip", wrapper)
          build_gradle = Path("android/build.gradle").read_text()
          agp_match = re.search(r"com\.android\.tools\.build:gradle:([\d.]+)", build_gradle)
          variables = Path("android/variables.gradle").read_text()
          sdk_match = re.search(r"compileSdkVersion\s*=\s*(\d+)", variables)

          if not gradle_match or not agp_match or not sdk_match:
              raise SystemExit("Could not read the Gradle, Android Gradle Plugin, or compile SDK version.")

          gradle_version = tuple(map(int, gradle_match.group(1).split(".")))
          agp_version = tuple(map(int, agp_match.group(1).split(".")))
          compile_sdk = int(sdk_match.group(1))
          if cli_major != 8 or android_major != cli_major:
              raise SystemExit(
                  f"Expected matching Capacitor 8 packages; found CLI {cli['version']} "
                  f"and Android {android['version']}."
              )
          if node_major < 22:
              raise SystemExit(f"Capacitor CLI requires Node {node_requirement}; this workflow needs Node 22 or newer.")
          if agp_version[:2] != (8, 13) or gradle_version < (8, 13):
              raise SystemExit(
                  f"Review Gradle/AGP compatibility: AGP {agp_match.group(1)}, "
                  f"Gradle {gradle_match.group(1)}."
              )
          if compile_sdk != 36:
              raise SystemExit(f"Expected compile SDK 36; found {compile_sdk}.")

          print(
              f"Compatible configuration: Capacitor {cli['version']}, Node >= {node_major}, "
              f"JDK 21, AGP {agp_match.group(1)}, Gradle {gradle_match.group(1)}, "
              f"compile SDK {compile_sdk}."
          )
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Health-Hub-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
